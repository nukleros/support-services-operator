kind: ComponentWorkload
name: database-component
spec:
  api:
    clusterScoped: true
    domain: addons.nukleros.io
    group: application
    kind: DatabaseComponent
    version: v1alpha1
  companionCliSubcmd:
    description: Manage the database support services
    name: database
  dependencies: []
  resources:
    - namespace.yaml

    # zalando-postgres
    - zalando-postgres/manifests/config.yaml
    - zalando-postgres/manifests/deployment.yaml
    - zalando-postgres/manifests/rbac.yaml
    - zalando-postgres/manifests/service.yaml

    # cloudnative-pg
    - cloudnative-pg/manifests/config.yaml
    - cloudnative-pg/manifests/crds.yaml
    - cloudnative-pg/manifests/deployment.yaml
    - cloudnative-pg/manifests/rbac.yaml
    - cloudnative-pg/manifests/service.yaml
    - cloudnative-pg/manifests/webhook.yaml
