kind: WorkloadCollection
name: support-services-collection
spec:
  api:
    clusterScoped: true
    domain: addons.nukleros.io
    group: setup
    kind: SupportServices
    version: v1alpha1
  companionCliRootcmd:
    description: Manage Kubernetes cluster support service installations
    name: ssctl
  companionCliSubcmd:
    description: Manage the setup of support services
    name: collection
  componentFiles:
    # application components
    - ../application.addons.nukleros.io/database-component/workload.yaml
    
    # platform components
    - ../platform.addons.nukleros.io/certificates-component/workload.yaml
    - ../platform.addons.nukleros.io/ingress-component/workload.yaml
    - ../platform.addons.nukleros.io/secrets-component/workload.yaml
    - ../platform.addons.nukleros.io/service-mesh-component/workload.yaml
    - ../platform.addons.nukleros.io/storage-component/workload.yaml
  resources:
    - namespace.yaml

    # gateway api crds
    # NOTE: gateway api crds must be created during setup so that they
    #       are made available to all components once enableGatewayAPI=true.
    - gateway-api/manifests/crds.yaml
    - gateway-api/manifests/webhook.yaml
