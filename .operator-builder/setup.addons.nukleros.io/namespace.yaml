---
# NOTE: the XValidation marker below must contain no whitespace.  struct marker descriptions
#       are word-wrapped at 80 characters and, unlike field markers, +kubebuilder: lines are
#       not exempt, so any space would split the marker across comment lines.

# +operator-builder:struct:name=".",description=`
# SupportServicesSpec defines the desired state of SupportServices.
#
# +kubebuilder:validation:XValidation:rule="!(self.cloud=='google'&&self.platform=='kind')"
#
# +kubebuilder:validation:XValidation:rule="!(self.platform=='gke'&&self.gatewayAPI=='managed')"`

# +operator-builder:field:name=tier,arbitrary,default="development",type=string,description=`
# +kubebuilder:validation:Enum=development;staging;production
# The tier of cluster being used.  One of: development | staging | production.`

# +operator-builder:field:name=defaultIngressController,arbitrary,default="nginx",type=string,description=`
# +kubebuilder:validation:Enum=kong;nginx
# The default ingress for setting TLS certs.  One of: kong | nginx.`

# +operator-builder:field:name=cloud,arbitrary,default="local",type=string,description=`
# +kubebuilder:validation:Enum=local;google;aws
# Cloud that this operator is running on.  One of: local | google | aws.
# When set to google, platform must also be set explicitly (e.g. gke), as the
# default platform of kind is not allowed.`

# +operator-builder:field:name=platform,arbitrary,default="kind",type=string,description=`
# +kubebuilder:validation:Enum=kind;gke;openshift;eks;aks
# Platform that this operator is running on.  One of: kind | gke | openshift | eks | aks.
# Platform is set independently of cloud and is not inferred from it.  GKE clusters
# must set platform to gke: the generic (kind) istio-cni daemonset installs CNI
# plugins to /opt/cni/bin, while the GKE kubelet reads them from /home/kubernetes/bin,
# so pod sandboxes fail to start.  The combination of cloud=google and platform=kind
# is rejected.`

# +operator-builder:field:name=gatewayAPI,arbitrary,default="disabled",type=string,description=`
# +kubebuilder:validation:Enum=disabled;external;managed
# How the Kubernetes Gateway API CRDs are provided.  One of: disabled | external | managed.
#
# NOTE: only managed currently has any effect.  This field controls only whether this
# operator installs the Gateway API CRDs and admission policies.  It is not read by any
# component and does not toggle Gateway API features (e.g. in istiod), which detect the
# CRDs on the cluster independently.  disabled and external are reserved for future use
# by components and currently behave identically.
#
# disabled: this operator does not install or manage the CRDs.  Any Gateway API CRDs
# already present on the cluster are left as-is and may still be used by components.
#
# external: the CRDs are provided by the platform (e.g. GKE with Gateway API enabled)
# or installed outside of this operator.  This operator does not install them.
#
# managed: this operator installs and manages the CRDs via the standard channel.
# Do not use on clusters where the provider manages them.  Use external instead.
# The combination of platform=gke and gatewayAPI=managed is rejected.`
apiVersion: v1
kind: Namespace
metadata:
  name: nukleros-support-services-system  # +operator-builder:field:parent=metadata.name,type=string
