---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: seaweedfs-admin
  namespace: nukleros-storage-system
spec:
  seaweedRef:
    name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: seaweedfs-admin
  namespace: nukleros-storage-system
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: seaweedfs-admin
  secretRef:
    name: seaweedfs-s3-admin
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: seaweedfs-admin
  namespace: nukleros-storage-system
spec:
  seaweedRef:
    name: seaweedfs
  statements:
    - effect: Allow
      actions:
        - "*"
      resources:
        - "*"
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: seaweedfs-admin
  namespace: nukleros-storage-system
spec:
  seaweedRef:
    name: seaweedfs
  policyRef:
    name: seaweedfs-admin
  subjects:
    - kind: S3Identity
      name: seaweedfs-admin
