---
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweedfs
  namespace: nukleros-storage-system
spec:
  image: chrislusf/seaweedfs:4.51
  volumeServerDiskCount: 1
  master:
    replicas: 1
    volumeSizeLimitMB: 1024
    defaultReplication: "000"
  volume:
    replicas: 1
    requests:
      storage: 10Gi
  filer:
    replicas: 1
    persistence:
      enabled: true
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
    s3:
      enabled: true
