---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: seaweedfs-operator-webhook-cert
  namespace: nukleros-storage-system # +operator-builder:field:name=namespace,default="nukleros-storage-system",type=string
  labels:
    app.kubernetes.io/name: seaweedfs-operator
    app.kubernetes.io/instance: seaweedfs-operator
    app: seaweedfs-operator
    platform.nukleros.io/category: storage
    platform.nukleros.io/project: seaweedfs-operator
    app.kubernetes.io/component: seaweedfs-operator
spec:
  dnsNames:
    - seaweedfs-operator-webhook
    - seaweedfs-operator-webhook.storage-namespace # +operator-builder:field:name=namespace,type=string,replace="storage-namespace"
    - seaweedfs-operator-webhook.storage-namespace.svc # +operator-builder:field:name=namespace,type=string,replace="storage-namespace"
    - seaweedfs-operator-webhook.storage-namespace.svc.cluster.local # +operator-builder:field:name=namespace,type=string,replace="storage-namespace"
  secretName: seaweedfs-operator-webhook-server-cert
  issuerRef:
    name: seaweedfs-operator-webhook-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: seaweedfs-operator-webhook-selfsigned-issuer
  namespace: nukleros-storage-system # +operator-builder:field:name=namespace,default="nukleros-storage-system",type=string
  labels:
    app.kubernetes.io/name: seaweedfs-operator
    app.kubernetes.io/instance: seaweedfs-operator
    app: seaweedfs-operator
    platform.nukleros.io/category: storage
    platform.nukleros.io/project: seaweedfs-operator
    app.kubernetes.io/component: seaweedfs-operator
spec:
  selfSigned: {}
