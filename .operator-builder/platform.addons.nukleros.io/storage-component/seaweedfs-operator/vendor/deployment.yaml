apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-operator
  namespace: nukleros-storage-system
  labels:
    app.kubernetes.io/name: seaweedfs-operator
    app.kubernetes.io/instance: seaweedfs-operator
    app: seaweedfs-operator
    platform.nukleros.io/category: storage
    platform.nukleros.io/project: seaweedfs-operator
    app.kubernetes.io/component: seaweedfs-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-operator
      app.kubernetes.io/instance: seaweedfs-operator
      app.kubernetes.io/component: seaweedfs-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-operator
        app.kubernetes.io/instance: seaweedfs-operator
        platform.nukleros.io/category: storage
        platform.nukleros.io/project: seaweedfs-operator
        app.kubernetes.io/component: seaweedfs-operator
    spec:
      serviceAccountName: seaweedfs-operator
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs-operator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: chrislusf/seaweedfs-operator:1.0.42
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 9443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
      terminationGracePeriodSeconds: 10
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: seaweedfs-operator-webhook-server-cert
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - seaweedfs-operator
      nodeSelector:
        kubernetes.io/os: linux
