---
# +operator-builder:resource:field=nginx.include,value=true,include
apiVersion: v1
# +operator-builder:resource:collectionField=cloud,value="local",include
kind: Service
metadata:
  name: nginx-ingress-nodeport
  namespace: nukleros-ingress-system # +operator-builder:field:name=namespace,default="nukleros-ingress-system",type=string
  labels:
    platform.nukleros.io/category: ingress
    platform.nukleros.io/project: nginx-ingress-controller
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    - port: 443
      targetPort: 443
      protocol: TCP
      name: https
  selector:
    app: nginx-ingress
