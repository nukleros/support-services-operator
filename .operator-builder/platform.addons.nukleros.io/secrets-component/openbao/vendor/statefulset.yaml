---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: nukleros-secrets-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: openbao
    platform.nukleros.io/category: secrets
    platform.nukleros.io/project: openbao
spec:
  serviceName: openbao-internal
  podManagementPolicy: OrderedReady
  replicas: 3
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: openbao
      component: server
  template:
    metadata:
      labels:
        helm.sh/chart: openbao-0.29.2
        app.kubernetes.io/name: openbao
        app.kubernetes.io/instance: openbao
        component: server
        platform.nukleros.io/category: secrets
        platform.nukleros.io/project: openbao
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: openbao
                    app.kubernetes.io/name: openbao
                    component: server
                topologyKey: kubernetes.io/hostname
              weight: 100
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 10
      serviceAccountName: openbao
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 100
        fsGroup: 1000
      hostNetwork: false
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: userconfig-openbao-unseal-key
          secret:
            secretName: openbao-unseal-key
            defaultMode: 256
        - name: home
          emptyDir: {}
      initContainers:
        - command:
            - /bin/sh
            - -c
            - |
              [ "$(hostname)" = "openbao-0" ] || exit 0

              cp /openbao/config/extraconfig-from-values.hcl /tmp/storageconfig.hcl
              bao server -config=/tmp/storageconfig.hcl &
              BAO_PID=$!

              n=0
              while ! bao status 2>/dev/null | grep -q '^Initialized'; do
                n=$((n+1))
                if [ "$n" -ge 30 ]; then
                  kill -TERM "$BAO_PID"
                  wait "$BAO_PID" 2>/dev/null
                  exit 0
                fi
                sleep 2
              done

              if ! bao status 2>/dev/null | grep -Eq '^Initialized +true'; then
                INIT_OUTPUT="$(bao operator init -format=json 2>&1)"

                # The root token + recovery keys above are only ever printed this
                # once. Persist them to a Secret so a later pod restart (which
                # skips straight past this block, since it's already initialized)
                # doesn't leave them unrecoverable in a log that's since rotated
                # away. Only ever creates this one, specific secret name - see the
                # RBAC note on the Role granting this.
                #
                # --no-check-certificate: this image's wget has no way to point at
                # a custom CA bundle (no --ca-certificate flag, and neither
                # SSL_CERT_FILE nor appending to the system bundle made it trust a
                # test cert when checked) so it can't validate the cluster's own
                # API server certificate. This call stays inside the pod network
                # and is bearer-token authenticated regardless, so skipping server
                # cert validation is an accepted tradeoff for this one-time
                # bootstrap call rather than a real MITM exposure.
                TOKEN_FILE=/var/run/secrets/kubernetes.io/serviceaccount/token
                if [ -f "$TOKEN_FILE" ]; then
                  RECOVERY_KEYS=$(printf '%s' "$INIT_OUTPUT" | sed -n '/"recovery_keys_b64"/,/\]/p' | grep -oE '"[A-Za-z0-9+/=]{20,}"' | tr -d '"')
                  B64_INIT=$(printf '%s' "$INIT_OUTPUT" | base64 | tr -d '\n')
                  B64_RECOVERY=$(printf '%s' "$RECOVERY_KEYS" | base64 | tr -d '\n')
                  printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"openbao-token"},"type":"Opaque","data":{"init-output.json":"%s","recovery-keys.txt":"%s"}}' "$B64_INIT" "$B64_RECOVERY" > /tmp/secret.json
                  echo "=== creating openbao-token secret ==="
                  wget -q -O- --no-check-certificate \
                    --header="Authorization: Bearer $(cat "$TOKEN_FILE")" \
                    --header="Content-Type: application/json" \
                    --post-file=/tmp/secret.json \
                    "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/api/v1/namespaces/${BAO_K8S_NAMESPACE}/secrets" 2>&1
                  echo ""
                  echo "=== secret creation attempt complete (see result above) ==="
                fi
                sleep 2
              fi

              kill -TERM "$BAO_PID"
              wait "$BAO_PID" 2>/dev/null
              exit 0
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: BAO_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BAO_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BAO_ADDR
              value: http://127.0.0.1:8200
            - name: BAO_API_ADDR
              value: http://$(POD_IP):8200
            - name: BAO_CLUSTER_ADDR
              value: https://$(HOSTNAME).openbao-internal:8201
            - name: HOME
              value: /home/openbao
            - name: BAO_LOG_FORMAT
              value: json
          image: quay.io/openbao/openbao:2.6.2
          name: bao-init
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /openbao/config
              name: config
            - mountPath: /openbao/data
              name: data
            - mountPath: /openbao/userconfig/openbao-unseal-key
              name: userconfig-openbao-unseal-key
              readOnly: true
            - mountPath: /home/openbao
              name: home
      containers:
        - name: openbao
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 250m
              memory: 256Mi
          image: quay.io/openbao/openbao:2.6.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - "cp /openbao/config/extraconfig-from-values.hcl /tmp/storageconfig.hcl;\n[ -n \"${HOST_IP}\" ] && sed -Ei \"s|HOST_IP|${HOST_IP?}|g\" /tmp/storageconfig.hcl;\n[ -n \"${POD_IP}\" ] && sed -Ei \"s|POD_IP|${POD_IP?}|g\" /tmp/storageconfig.hcl;\n[ -n \"${HOSTNAME}\" ] && sed -Ei \"s|HOSTNAME|${HOSTNAME?}|g\" /tmp/storageconfig.hcl;\n[ -n \"${API_ADDR}\" ] && sed -Ei \"s|API_ADDR|${API_ADDR?}|g\" /tmp/storageconfig.hcl;\n[ -n \"${TRANSIT_ADDR}\" ] && sed -Ei \"s|TRANSIT_ADDR|${TRANSIT_ADDR?}|g\" /tmp/storageconfig.hcl;\n[ -n \"${RAFT_ADDR}\" ] && sed -Ei \"s|RAFT_ADDR|${RAFT_ADDR?}|g\" /tmp/storageconfig.hcl;\n/usr/local/bin/docker-entrypoint.sh bao server -config=/tmp/storageconfig.hcl \n"
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: BAO_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BAO_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BAO_ADDR
              value: http://127.0.0.1:8200
            - name: BAO_API_ADDR
              value: http://$(POD_IP):8200
            - name: SKIP_CHOWN
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BAO_CLUSTER_ADDR
              value: https://$(HOSTNAME).openbao-internal:8201
            - name: HOME
              value: /home/openbao
            - name: BAO_LOG_FORMAT
              value: json
          volumeMounts:
            - name: audit
              mountPath: /openbao/audit
            - name: data
              mountPath: /openbao/data
            - name: config
              mountPath: /openbao/config
            - name: userconfig-openbao-unseal-key
              readOnly: true
              mountPath: /openbao/userconfig/openbao-unseal-key
            - name: home
              mountPath: /home/openbao
          ports:
            - containerPort: 8200
              name: http
            - containerPort: 8201
              name: https-internal
            - containerPort: 8202
              name: http-rep
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - bao status -tls-skip-verify
            failureThreshold: 2
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5 && kill -SIGTERM $(pidof bao)
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: audit
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
