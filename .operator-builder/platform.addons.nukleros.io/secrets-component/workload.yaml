kind: ComponentWorkload
name: secrets-component
spec:
  api:
    clusterScoped: true
    domain: addons.nukleros.io
    group: platform
    kind: SecretsComponent
    version: v1alpha1
  companionCliSubcmd:
    description: Manage the secrets management support services
    name: secrets
  dependencies: []
  resources:
    - namespace.yaml

    # external-secrets
    - external-secrets/manifests/config.yaml
    - external-secrets/manifests/crds.yaml
    - external-secrets/manifests/deployment.yaml
    - external-secrets/manifests/rbac.yaml
    - external-secrets/manifests/service.yaml
    - external-secrets/manifests/webhook.yaml

    # secret reloader
    - reloader/manifests/deployment.yaml
    - reloader/manifests/rbac.yaml

    # openbao
    - openbao/manifests/config.yaml
    - openbao/manifests/rbac.yaml
    - openbao/manifests/networkpolicy.yaml
    - openbao/manifests/poddisruptionbudget.yaml
    - openbao/manifests/statefulset.yaml
    - openbao/manifests/deployment.yaml
    - openbao/manifests/service.yaml
    - openbao/manifests/webhook.yaml
