apiVersion: platform.addons.nukleros.io/v1alpha1
kind: SecretsComponent
metadata:
  name: secretscomponent-sample
spec:
  #collection:
    #name: "supportservices-sample"
    #namespace: ""
  openbao:
    injector:
      include: true
      replicas: 2
      image: "docker.io/hashicorp/vault-k8s"
      imageVersion: "1.7.2"
    unsealKey:
      secret:
        type: "managed"
        namespace: ""
        name: "openbao-unseal-key"
    replicas: 3
    image: "quay.io/openbao/openbao"
    version: "2.6.2"
    storage:
      data:
        size: "10Gi"
        class: ""
      audit:
        size: "10Gi"
        class: ""
  namespace: "nukleros-secrets-system"
  externalSecrets:
    version: "v0.5.9"
    certController:
      replicas: 1
    image: "ghcr.io/external-secrets/external-secrets"
    controller:
      replicas: 2
    webhook:
      replicas: 2
  reloader:
    replicas: 1
    image: "stakater/reloader"
    version: "v0.0.119"
