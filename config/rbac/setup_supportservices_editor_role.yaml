# This rule is not used by the project support-services-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the setup.addons.nukleros.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: support-services-operator
    app.kubernetes.io/managed-by: kustomize
  name: setup-supportservices-editor-role
rules:
- apiGroups:
  - setup.addons.nukleros.io
  resources:
  - supportservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - setup.addons.nukleros.io
  resources:
  - supportservices/status
  verbs:
  - get
